<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaosOps 控制台</title>
    <script>
      // 主题切换防闪烁：在 Element Plus 样式加载前应用主题类
      (function () {
        const STORAGE_KEY = 'chaosops-theme';
        const stored = localStorage.getItem(STORAGE_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BFFUf0kr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B6NRYMlJ.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
